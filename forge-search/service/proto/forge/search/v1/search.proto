syntax = "proto3";

package forge.search.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/r59q/forge-tools/forge-search/service/searchpb";

// SearchService searches caller-supplied documents, checkout files and
// repository issues with or without a durable index. Indexing a
// checkout again, or another checkout into the same index, changes only the
// files that differ. Every RPC requires the service token in the
// Authorization: Bearer header (gRPC metadata).
//
// Checkouts are named by their forge-checkouts ID and must be ready or
// retained. Matches name files by their path in the checkout. Indexed and
// unindexed searches of the same files return the same matches in the same
// order.
//
// A repository reference is checked out by the service itself, through
// forge-checkouts, only within an IndexRepository or SearchRepository call,
// and the checkout is removed before the call returns. The service never
// fetches code on its own.
//
// Indexing code also indexes its definitions, such as functions, methods
// and types, found with the forge-symbols library in the service itself.
// Index.symbols tells whether they are complete for the index revision.
// Indexed and unindexed symbol searches of the same files return the same
// definitions in the same order.
//
// A repository's issues are read from forge-issues, in one listing of its
// open and closed issues, only within an IndexIssues or
// SearchUnindexedIssues call; the service never fetches issues on its own.
// Indexed and unindexed searches of the same issues return the same matches
// in the same order. Without a forge-issues address, those two calls fail
// with UNIMPLEMENTED and the others still work.
//
// Errors carry only a status code: INVALID_ARGUMENT for an invalid field or
// a source forge-issues rejects, NOT_FOUND for a missing index or
// checkout, or an unknown source, repository or reference,
// PERMISSION_DENIED when the forge refuses access,
// FAILED_PRECONDITION for a checkout that is not ready or not readable here,
// ABORTED for an index already being indexed or files that changed while
// read, RESOURCE_EXHAUSTED for a request, checkout, issue listing or index
// over a limit, or a forge rate limit, UNAVAILABLE when forge-checkouts,
// forge-issues or the storage cannot be reached, UNIMPLEMENTED for an issue
// call that needs forge-issues without one, and DEADLINE_EXCEEDED for a call
// over its time limit.
service SearchService {
  // CreateIndex creates an empty named index.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse) {
    option (google.api.http) = {
      post: "/v1/indexes"
      body: "*"
    };
  }
  // PutDocument atomically adds or replaces a caller-supplied document by path.
  rpc PutDocument(PutDocumentRequest) returns (PutDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/documents:put"
      body: "*"
    };
  }
  // RemoveDocument removes a caller-supplied document by path.
  rpc RemoveDocument(RemoveDocumentRequest) returns (RemoveDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/documents:remove"
      body: "*"
    };
  }
  // SearchDocuments searches the supplied documents or those previously uploaded to index.
  rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse) {
    option (google.api.http) = {
      post: "/v1/documents:search"
      body: "*"
    };
  }
  // IndexCheckout syncs a checkout's files into an index, creating the
  // index if needed, and returns what changed. It runs within the call; a
  // call that ends early keeps what it wrote, and the next one continues.
  // POST /v1/indexes/{index}/checkout.
  rpc IndexCheckout(IndexCheckoutRequest) returns (IndexCheckoutResponse) {
    option (google.api.http) = {
      post: "/v1/indexes/{index}/checkout"
      body: "*"
    };
  }
  // ListIndexes returns every index, by name. GET /v1/indexes.
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse) {
    option (google.api.http) = {get: "/v1/indexes"};
  }
  // GetIndex returns the status of one index. GET /v1/indexes/{index}.
  rpc GetIndex(GetIndexRequest) returns (GetIndexResponse) {
    option (google.api.http) = {get: "/v1/indexes/{index}"};
  }
  // DeleteIndex removes an index and its content.
  // DELETE /v1/indexes/{index}.
  rpc DeleteIndex(DeleteIndexRequest) returns (DeleteIndexResponse) {
    option (google.api.http) = {delete: "/v1/indexes/{index}"};
  }
  // SearchIndex searches the code held by an index.
  // POST /v1/indexes/{index}:search.
  rpc SearchIndex(SearchIndexRequest) returns (SearchIndexResponse) {
    option (google.api.http) = {
      post: "/v1/indexes/{index}:search"
      body: "*"
    };
  }
  // SearchCheckout reads and searches a checkout's files without an index,
  // and keeps nothing. POST /v1/checkouts/{checkout_id}:search.
  rpc SearchCheckout(SearchCheckoutRequest) returns (SearchCheckoutResponse) {
    option (google.api.http) = {
      post: "/v1/checkouts/{checkout_id}:search"
      body: "*"
    };
  }
  // IndexRepository checks out a repository reference at its current
  // commit, syncs it into the index of that reference and removes the
  // checkout. The service names the index and creates it if needed. An
  // index already at that commit is left as it is. It runs within the call.
  // POST /v1/repositories:index.
  rpc IndexRepository(IndexRepositoryRequest) returns (IndexRepositoryResponse) {
    option (google.api.http) = {
      post: "/v1/repositories:index"
      body: "*"
    };
  }
  // SearchRepository searches the index of a repository reference. Without
  // one, it checks the reference out, searches it unindexed and removes the
  // checkout. POST /v1/repositories:search.
  rpc SearchRepository(SearchRepositoryRequest) returns (SearchRepositoryResponse) {
    option (google.api.http) = {
      post: "/v1/repositories:search"
      body: "*"
    };
  }
  // IndexIssues reads a repository's issues and syncs them into the issue
  // index of that repository, creating it if needed. Calling it again
  // refreshes the index, changing only the issues that differ. It runs
  // within the call. POST /v1/issues:index.
  rpc IndexIssues(IndexIssuesRequest) returns (IndexIssuesResponse) {
    option (google.api.http) = {
      post: "/v1/issues:index"
      body: "*"
    };
  }
  // SearchIndexedIssues searches the issue index of a repository without
  // reading forge-issues. POST /v1/issues:searchIndexed.
  rpc SearchIndexedIssues(SearchIndexedIssuesRequest) returns (SearchIndexedIssuesResponse) {
    option (google.api.http) = {
      post: "/v1/issues:searchIndexed"
      body: "*"
    };
  }
  // SearchUnindexedIssues reads a repository's issues and searches them
  // without an index, keeping nothing. POST /v1/issues:searchUnindexed.
  rpc SearchUnindexedIssues(SearchUnindexedIssuesRequest) returns (SearchUnindexedIssuesResponse) {
    option (google.api.http) = {
      post: "/v1/issues:searchUnindexed"
      body: "*"
    };
  }
  // SearchIndexSymbols searches the definitions of the files an index
  // holds by name. IndexCheckout and IndexRepository maintain them.
  // POST /v1/indexes/{index}/symbols:search.
  rpc SearchIndexSymbols(SearchIndexSymbolsRequest) returns (SearchIndexSymbolsResponse) {
    option (google.api.http) = {
      post: "/v1/indexes/{index}/symbols:search"
      body: "*"
    };
  }
  // SearchCheckoutSymbols reads a checkout's files, finds their
  // definitions and searches them by name without an index, keeping
  // nothing. POST /v1/checkouts/{checkout_id}/symbols:search.
  rpc SearchCheckoutSymbols(SearchCheckoutSymbolsRequest) returns (SearchCheckoutSymbolsResponse) {
    option (google.api.http) = {
      post: "/v1/checkouts/{checkout_id}/symbols:search"
      body: "*"
    };
  }
}

// RepositoryTarget names a repository reference on a forge.
message RepositoryTarget {
  // source is the forge-connector connection ID: 1-128 bytes of A-Z, a-z,
  // 0-9, "_" and "-".
  string source = 1;
  // repository is the repository path, such as "owner/name": at most 256
  // bytes, 2-16 segments of A-Z, a-z, 0-9, ".", "_" and "-", other than "."
  // and "..".
  string repository = 2;
  // reference is a branch, tag or commit: at most 256 bytes of a valid Git
  // reference name. Empty, or "HEAD", is the default branch, which
  // responses name "".
  string reference = 3;
}

// Index is the status of an index.
message Index {
  // name is 1-64 bytes of a-z, 0-9, ".", "_" and "-", starting with a
  // letter or digit, without "..".
  string name = 1;
  // documents is the number of files the index holds.
  int64 documents = 2;
  // bytes is the content size of those files and of their stored
  // definitions.
  int64 bytes = 3;
  // revision is the checkout revision of the last completed indexing. It is
  // empty before one, and while an indexing changes the index.
  string revision = 4;
  // checkout_id is the checkout of the last completed indexing.
  string checkout_id = 5;
  // updated_at is when the last completed indexing finished.
  google.protobuf.Timestamp updated_at = 6;
  // target is the repository reference of an index IndexRepository made.
  // Its checkout_id names a checkout that has since been removed.
  RepositoryTarget target = 7;
  // issues is the repository of an index IndexIssues made, which holds
  // issues rather than files. Its updated_at is when the issue listing of
  // the last completed IndexIssues was read: it is unset while one runs and
  // after one fails.
  IssueRepository issues = 8;
  // symbols is the state of the definitions of the files. It is unset for
  // an issue index.
  IndexSymbols symbols = 9;
}

// IndexSymbols is the state of the definitions an index holds.
message IndexSymbols {
  // complete is set when the definitions are those of the files at
  // revision: every file was analyzed or is counted in skipped. It is
  // unset while an indexing runs, and after one whose symbol pass failed
  // or stopped at a limit; the next indexing analyzes every file again.
  bool complete = 1;
  // documents counts the files holding definitions.
  int64 documents = 2;
  // skipped counts the files without definitions because they were left
  // out. It covers every file, not only those of the last indexing.
  SymbolFileState skipped = 3;
}

// SymbolFileState counts the files whose definitions were left out. None of
// them fails a call.
message SymbolFileState {
  // unsupported counts files in a language without symbol support, and
  // binary files.
  int32 unsupported = 1;
  // too_large counts files over 1 MiB, with more than 10000 definitions,
  // or whose definitions take more than 1 MiB.
  int32 too_large = 2;
  // failed counts files whose parse took longer than 5 s or more than
  // 256 MiB of memory.
  int32 failed = 3;
}

// SymbolPass is what an indexing did to the definitions of an index.
message SymbolPass {
  // stored counts the files whose definitions were written, and
  // definitions the definitions they hold.
  int32 stored = 1;
  int32 definitions = 2;
  // removed counts the files whose definitions were dropped: removed
  // files, and changed ones that no longer have any.
  int32 removed = 3;
  // skipped counts the files of this pass that were left out.
  SymbolFileState skipped = 4;
  // full is set when every file was analyzed, not only the changed ones:
  // on the first indexing, and after one that left symbols incomplete.
  bool full = 5;
  // truncated is set when the pass stopped at a limit: over 10000 files or
  // 256 MiB to analyze, or a full index. Index.symbols.complete is then
  // unset; the files are indexed all the same.
  bool truncated = 6;
}

// FileState counts the checkout files left out.
message FileState {
  // truncated is set when files were not read because of the total size
  // limit of an unindexed search.
  bool truncated = 1;
  // too_large counts files over 1 MiB.
  int32 too_large = 2;
  // unsupported counts symlinks, special files and paths that cannot be
  // document IDs.
  int32 unsupported = 3;
}

// IndexCheckoutRequest names the checkout to index.
message IndexCheckoutRequest {
  // index is the index name. It is created if it does not exist. Names
  // starting with "repo-" or "issues-" belong to IndexRepository and
  // IndexIssues and are refused.
  string index = 1;
  // checkout_id is the forge-checkouts checkout ID.
  string checkout_id = 2;
}

// IndexCheckoutResponse is the index after the sync and what it changed.
message IndexCheckoutResponse {
  Index index = 1;
  // added, replaced and removed count the files written; unchanged counts
  // those left as they were.
  int32 added = 2;
  int32 replaced = 3;
  int32 removed = 4;
  int32 unchanged = 5;
  // files counts the files left out of the index.
  FileState files = 6;
  // symbols is what the sync did to the definitions of the files.
  SymbolPass symbols = 7;
}

// ListIndexesRequest has no fields.
message ListIndexesRequest {}

// ListIndexesResponse holds every index, by name.
message ListIndexesResponse {
  repeated Index indexes = 1;
}

// GetIndexRequest names an index.
message GetIndexRequest {
  string index = 1;
}

// GetIndexResponse is the status of the index.
message GetIndexResponse {
  Index index = 1;
}

// DeleteIndexRequest names an index.
message DeleteIndexRequest {
  string index = 1;
}

// DeleteIndexResponse has no fields.
message DeleteIndexResponse {}

// CodeQuery is what to search for.
message CodeQuery {
  // text is matched literally and case-sensitively within lines: 1-256
  // bytes of UTF-8, without NUL, "\r" or "\n".
  string text = 1;
  // path_prefix keeps only files whose path starts with it, such as "cmd/".
  string path_prefix = 2;
  // max_results is the most matches returned: 1-500, 0 for 100.
  int32 max_results = 3;
}

// Range uses one-based lines and UTF-16 columns, with an exclusive end
// column. Lines end at "\n".
message Range {
  int32 start_line = 1;
  int32 start_column = 2;
  int32 end_line = 3;
  int32 end_column = 4;
}

// CodeMatch is one occurrence of the query text.
message CodeMatch {
  // path is the supplied document identifier or checkout path, with "/" separators.
  string path = 1;
  // version is the hex SHA-256 of the file content.
  string version = 2;
  // range covers the matched text.
  Range range = 3;
  // preview is the matching line, at most 240 UTF-16 units; text cut at
  // either end is marked with "…".
  string preview = 4;
  // preview_column is the column where the preview text starts.
  int32 preview_column = 5;
}

// SearchState describes an incomplete search.
message SearchState {
  // truncated is set when matches were left out because of max_results, or
  // files because of a size limit.
  bool truncated = 1;
  // skipped counts files or issues not searched because they hold a NUL
  // byte or are not valid UTF-8.
  int32 skipped = 2;
}

// SearchIndexRequest searches an index.
message SearchIndexRequest {
  string index = 1;
  CodeQuery query = 2;
}

// SearchIndexResponse holds the matches in path order, then position.
message SearchIndexResponse {
  repeated CodeMatch matches = 1;
  SearchState state = 2;
  // revision is Index.revision as read just before the search.
  string revision = 3;
}

// SearchCheckoutRequest searches a checkout without an index.
message SearchCheckoutRequest {
  string checkout_id = 1;
  CodeQuery query = 2;
}

// SearchCheckoutResponse holds the matches in path order, then position.
message SearchCheckoutResponse {
  repeated CodeMatch matches = 1;
  SearchState state = 2;
  // revision is the checkout revision.
  string revision = 3;
  // files counts the files left out of the search.
  FileState files = 4;
}

// IndexRepositoryRequest names the repository reference to index.
message IndexRepositoryRequest {
  RepositoryTarget target = 1;
}

// IndexRepositoryResponse is the index after the sync and what it changed.
message IndexRepositoryResponse {
  Index index = 1;
  // added, replaced, removed, unchanged, files and symbols are as in
  // IndexCheckoutResponse. They are zero when up_to_date.
  int32 added = 2;
  int32 replaced = 3;
  int32 removed = 4;
  int32 unchanged = 5;
  FileState files = 6;
  // up_to_date is set when the index already held the current commit, with
  // complete symbols, so that no file was read or written.
  bool up_to_date = 7;
  SymbolPass symbols = 8;
}

// SearchRepositoryRequest searches a repository reference.
message SearchRepositoryRequest {
  RepositoryTarget target = 1;
  CodeQuery query = 2;
}

// SearchRepositoryResponse holds the matches in path order, then position.
message SearchRepositoryResponse {
  repeated CodeMatch matches = 1;
  SearchState state = 2;
  // revision is Index.revision of the index searched, or the commit of the
  // temporary checkout.
  string revision = 3;
  // index is the status of the index searched. It is unset for an
  // unindexed search.
  Index index = 4;
  // files counts the files left out of an unindexed search.
  FileState files = 5;
}

// IssueRepository names a repository whose issues forge-issues serves.
message IssueRepository {
  // source is the forge-issues source ID, with the rules of
  // RepositoryTarget.source.
  string source = 1;
  // repository is the repository path, with the rules of
  // RepositoryTarget.repository.
  string repository = 2;
}

// IssueQuery is what to search for in issue titles and bodies.
message IssueQuery {
  // text is matched as CodeQuery.text is, within title and body lines.
  string text = 1;
  // state keeps only "open" or "closed" issues; empty keeps both. It
  // filters the first max_results matches of both states.
  string state = 2;
  // max_results is the most matches returned: 1-500, 0 for 100.
  int32 max_results = 3;
}

// IssueMatch is one occurrence of the query text in an issue.
message IssueMatch {
  int64 number = 1;
  // title is the issue title, on one line.
  string title = 2;
  // state is "open" or "closed".
  string state = 3;
  string web_url = 4;
  // field is "title" or "body", the part of the issue matched.
  string field = 5;
  // range covers the matched text, relative to the field.
  Range range = 6;
  // preview and preview_column are as in CodeMatch.
  string preview = 7;
  int32 preview_column = 8;
}

// IndexIssuesRequest names the repository whose issues to index.
message IndexIssuesRequest {
  IssueRepository repository = 1;
}

// IndexIssuesResponse is the index after the sync and what it changed.
message IndexIssuesResponse {
  Index index = 1;
  // added, replaced and removed count the issues written; unchanged counts
  // those left as they were.
  int32 added = 2;
  int32 replaced = 3;
  int32 removed = 4;
  int32 unchanged = 5;
  // too_large counts the issues left out because their body is over
  // 256 KiB, their title over 1 KiB or their web URL over 2 KiB.
  int32 too_large = 6;
  // synced_at is when the issue listing the index now holds was read.
  google.protobuf.Timestamp synced_at = 7;
}

// SearchIndexedIssuesRequest searches the issue index of a repository.
message SearchIndexedIssuesRequest {
  IssueRepository repository = 1;
  IssueQuery query = 2;
}

// SearchIndexedIssuesResponse holds the matches by issue number, then
// title before body, then position.
message SearchIndexedIssuesResponse {
  repeated IssueMatch matches = 1;
  SearchState state = 2;
  // index is the status of the index searched.
  Index index = 3;
}

// SearchUnindexedIssuesRequest searches a repository's issues without an
// index.
message SearchUnindexedIssuesRequest {
  IssueRepository repository = 1;
  IssueQuery query = 2;
}

// SearchUnindexedIssuesResponse holds the matches in the order of
// SearchIndexedIssuesResponse.
message SearchUnindexedIssuesResponse {
  repeated IssueMatch matches = 1;
  SearchState state = 2;
  // too_large counts the issues left out, as in IndexIssuesResponse.
  int32 too_large = 3;
}

// SymbolQuery is which definitions to find.
message SymbolQuery {
  // text is matched within definition names, literally and
  // case-sensitively, with the rules of CodeQuery.text.
  string text = 1;
  // kind keeps only definitions of one kind, such as "function",
  // "method", "class" or "type".
  string kind = 2;
  // language keeps only files of one language, such as "go" or "python".
  string language = 3;
  // path_prefix keeps only files whose path starts with it, such as "cmd/".
  string path_prefix = 4;
  // max_results is the most definitions returned: 1-500, 0 for 100.
  int32 max_results = 5;
}

// Symbol is one definition whose name holds the query text.
message Symbol {
  string name = 1;
  // kind is the kind of definition, such as "function" or "method".
  string kind = 2;
  // language is the language of the file, such as "go".
  string language = 3;
  // path and version are as in CodeMatch.
  string path = 4;
  string version = 5;
  // name_range covers the name; range covers the whole definition with its
  // body.
  Range name_range = 6;
  Range range = 7;
  // container names what the definition belongs to, such as the type of a
  // method. It is empty at the top level.
  string container = 8;
  // preview is the declaration line: the line of the name, cut to the
  // definition where it starts or ends on it, without indentation. Its
  // length and "…" follow CodeMatch.preview, with the name as the match.
  string preview = 9;
  // preview_column is the column where the preview text starts.
  int32 preview_column = 10;
}

// SearchIndexSymbolsRequest searches the definitions of an index.
message SearchIndexSymbolsRequest {
  string index = 1;
  SymbolQuery query = 2;
}

// SearchIndexSymbolsResponse holds the definitions in path order, then in
// the order they are declared.
message SearchIndexSymbolsResponse {
  repeated Symbol symbols = 1;
  // truncated is set when more definitions match than max_results.
  bool truncated = 2;
  // revision is Index.revision as read just before the search.
  string revision = 3;
  // complete is Index.symbols.complete as read just before the search.
  // Without it, some files may have no definitions or older ones.
  bool complete = 4;
}

// SearchCheckoutSymbolsRequest searches the definitions of a checkout
// without an index.
message SearchCheckoutSymbolsRequest {
  string checkout_id = 1;
  SymbolQuery query = 2;
}

// SearchCheckoutSymbolsResponse holds the definitions in the order of
// SearchIndexSymbolsResponse.
message SearchCheckoutSymbolsResponse {
  repeated Symbol symbols = 1;
  // truncated is as in SearchIndexSymbolsResponse.
  bool truncated = 2;
  // revision is the checkout revision.
  string revision = 3;
  // files counts the files left out because they could not be read.
  FileState files = 4;
  // skipped counts the files read whose definitions were left out.
  SymbolFileState skipped = 5;
}

// Document is caller-supplied text. Path is an opaque identifier of at most
// 4096 UTF-8 bytes. Content is at most 1 MiB and is base64 in JSON.
message Document {
  string path = 1;
  bytes content = 2;
}

// CreateIndexRequest names a new index. The repo- and issues- prefixes are reserved.
message CreateIndexRequest {
  string index = 1;
}

// CreateIndexResponse is empty on success.
message CreateIndexResponse {}

// PutDocumentRequest writes one document into an existing index.
message PutDocumentRequest {
  string index = 1;
  Document document = 2;
}

// PutDocumentResponse is empty on success.
message PutDocumentResponse {}

// RemoveDocumentRequest selects an uploaded document by index and path.
message RemoveDocumentRequest {
  string index = 1;
  string path = 2;
}

// RemoveDocumentResponse is empty on success.
message RemoveDocumentResponse {}

// SearchDocumentsRequest scans up to 256 documents and 4 MiB of content
// when index is empty and stores nothing. With an index, omit documents.
// Text and max_results follow CodeQuery.
message SearchDocumentsRequest {
  string index = 1;
  repeated Document documents = 2;
  string text = 3;
  int32 max_results = 4;
}

// SearchDocumentsResponse lists matches in path and line order.
message SearchDocumentsResponse {
  repeated CodeMatch matches = 1;
  SearchState state = 2;
}
