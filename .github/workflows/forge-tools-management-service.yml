name: forge-tools-management-service

on:
  push:
    branches: [master]
    paths:
      - forge-tools-management/service/**
      - forge-tools-management/library/**
      - forge-connector/library/**
      - forge-connector/broker/**
      - forge-repositories/service/**
      - forge-repositories/library/**
      - forge-issues/service/**
      - forge-issues/library/**
      - forge-actions/library/**
      - forge-actions/service/**
      - forge-reactor/library/**
      - forge-reactor/service/**
      - forge-core/forgeapi/**
      - forge-core/servicekit/**
      - examples/fullstack/**
      - .dockerignore
      - .github/workflows/forge-tools-management-service.yml
      - buf.yaml
      - buf.lock
      - .github/workflows/reusable-*.yml
  pull_request:
    paths:
      - forge-tools-management/service/**
      - forge-tools-management/library/**
      - forge-connector/library/**
      - forge-connector/broker/**
      - forge-repositories/service/**
      - forge-repositories/library/**
      - forge-issues/service/**
      - forge-issues/library/**
      - forge-actions/library/**
      - forge-actions/service/**
      - forge-reactor/library/**
      - forge-reactor/service/**
      - forge-core/forgeapi/**
      - forge-core/servicekit/**
      - examples/fullstack/**
      - .dockerignore
      - .github/workflows/forge-tools-management-service.yml
      - buf.yaml
      - buf.lock
      - .github/workflows/reusable-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate example
        env:
          FORGE_BROKER_KEY: example-broker-key
          FORGE_BROKER_ADMIN_TOKEN: example-admin-token
          FORGE_MANAGEMENT_TOKEN: example-operator-token
          FORGE_PROXY_TOKEN: example-proxy-token
          FORGE_REPOSITORIES_CONNECTOR_TOKEN: example-connector-token
          FORGE_REPOSITORIES_TOKEN: example-repositories-token
          FORGE_ISSUES_CONNECTOR_TOKEN: example-issues-connector-token
          FORGE_ISSUES_TOKEN: example-issues-token
          FORGE_CHECKOUTS_CONNECTOR_TOKEN: example-checkouts-connector-token
          FORGE_CHECKOUTS_TOKEN: example-checkouts-token
          FORGE_ACTIONS_TOKEN: example-actions-token
          FORGE_EXPLORER_TOKEN: example-explorer-token
          FORGE_PIPEPRINT_TOKEN: example-pipeprint-token
          FORGE_ACTIONS_CONNECTOR_TOKEN: example-actions-connector-token
        run: docker compose -f examples/fullstack/compose.yaml config --quiet

  test:
    uses: ./.github/workflows/reusable-go.yml
    with:
      dir: forge-tools-management/service

  proto:
    uses: ./.github/workflows/reusable-proto.yml
    with:
      dir: forge-tools-management/service

  # Pull requests build the image without pushing or registry access.
  image:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: forge-tools-management-service
      dockerfile: forge-tools-management/service/Dockerfile

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: forge-tools-management-service
      dockerfile: forge-tools-management/service/Dockerfile
      push: true
