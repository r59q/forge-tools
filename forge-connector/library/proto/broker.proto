syntax = "proto3";

package forge.connector.v1;
option go_package = "github.com/r59q/forge-tools/forge-connector/library/brokerpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Broker manages a single owner's connections. Admin RPCs require the admin
// Authorization: Bearer credential. Client RPCs use the client token in the same
// header (gRPC metadata). Use TLS when credentials cross a network boundary.
// Only CreateClient and IssueToken deliberately return tokens; do not log them.
service Broker {
  // CreateForge registers an API endpoint. Admin: POST /v1/forges.
  rpc CreateForge(CreateForgeRequest) returns (Forge) {
    option (google.api.http) = { post: "/v1/forges" body: "*" };
  }
  // ListForges lists registered endpoints by ID. Admin: GET /v1/forges.
  rpc ListForges(google.protobuf.Empty) returns (ListForgesResponse) {
    option (google.api.http) = { get: "/v1/forges" };
  }
  // DeleteForge removes an unused endpoint. Admin: DELETE /v1/forges/{id}.
  rpc DeleteForge(ForgeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/forges/{id}" };
  }
  // CreateConnection validates and seals a credential. Admin: POST /v1/connections.
  rpc CreateConnection(CreateConnectionRequest) returns (Connection) {
    option (google.api.http) = { post: "/v1/connections" body: "*" };
  }
  // ListConnections lists metadata by ID. Admin: GET /v1/connections.
  rpc ListConnections(google.protobuf.Empty) returns (ListConnectionsResponse) {
    option (google.api.http) = { get: "/v1/connections" };
  }
  // GetConnection reads metadata only. Admin: GET /v1/connections/{id}.
  rpc GetConnection(ConnectionRequest) returns (Connection) {
    option (google.api.http) = { get: "/v1/connections/{id}" };
  }
  // TestConnection refreshes status using Whoami. On failure it returns a safe
  // error; GetConnection reads the updated status. Admin: POST /v1/connections/{id}/test.
  rpc TestConnection(ConnectionRequest) returns (Connection) {
    option (google.api.http) = { post: "/v1/connections/{id}/test" body: "*" };
  }
  // RotateCredential validates a replacement before writing it atomically.
  // Admin: POST /v1/connections/{id}/credential.
  rpc RotateCredential(RotateCredentialRequest) returns (Connection) {
    option (google.api.http) = { post: "/v1/connections/{id}/credential" body: "*" };
  }
  // DeleteConnection removes the credential and grants atomically.
  // Admin: DELETE /v1/connections/{id}.
  rpc DeleteConnection(ConnectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/connections/{id}" };
  }
  // CreateClient returns a client token once. Admin: POST /v1/clients.
  rpc CreateClient(CreateClientRequest) returns (CreateClientResponse) {
    option (google.api.http) = { post: "/v1/clients" body: "*" };
  }
  // ListClients lists metadata by ID, without hashes. Admin: GET /v1/clients.
  rpc ListClients(google.protobuf.Empty) returns (ListClientsResponse) {
    option (google.api.http) = { get: "/v1/clients" };
  }
  // DeleteClient immediately revokes the token. Admin: DELETE /v1/clients/{id}.
  rpc DeleteClient(ClientRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/clients/{id}" };
  }
  // IssueToken returns a forge token to a scoped client with can_issue_tokens.
  // Client: POST /v1/connections/{connection_id}/token.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse) {
    option (google.api.http) = { post: "/v1/connections/{connection_id}/token" body: "*" };
  }
  // VerifyClient checks the bearer token's scope and connection health, without
  // decrypting credentials. The proxy forwards its caller's token in the bearer
  // header; there is no token in the body. It does not require can_issue_tokens.
  // Client: POST /v1/connections/{connection_id}/verify.
  rpc VerifyClient(VerifyClientRequest) returns (Client) {
    option (google.api.http) = { post: "/v1/connections/{connection_id}/verify" body: "*" };
  }
}

// Forge is registered endpoint metadata, without credentials.
message Forge {
  // id is generated by the broker.
  string id = 1;
  // kind is github, gitlab or forgejo.
  string kind = 2;
  // base_url includes the API path prefix and cannot contain URL credentials.
  string base_url = 3;
  // name is an owner-defined label.
  string name = 4;
}
// Identity is the last successfully authenticated forge user.
message Identity {
  // id is the forge's user ID.
  string id = 1;
  // login is the user name.
  string login = 2;
  // name is the display name.
  string name = 3;
  // email is the public or primary email, when visible.
  string email = 4;
}
// Connection contains metadata only; credentials are write-only.
message Connection {
  // id is generated by the broker.
  string id = 1;
  // forge_id references the immutable forge endpoint.
  string forge_id = 2;
  // name is an owner-defined label.
  string name = 3;
  // identity is the last successful Whoami result.
  Identity identity = 4;
  // status is ok, invalid or revoked. Only ok permits client use.
  string status = 5;
  // checked_at is the last credential check in UTC.
  google.protobuf.Timestamp checked_at = 6;
  // created_at is the creation time, preserved across rotations.
  google.protobuf.Timestamp created_at = 7;
}
// Client contains grants only, never the token hash.
message Client {
  // id is generated by the broker.
  string id = 1;
  // name is an owner-defined label.
  string name = 2;
  // connection_ids lists allowed connections; empty grants no access.
  repeated string connection_ids = 3;
  // can_issue_tokens permits IssueToken in addition to VerifyClient.
  bool can_issue_tokens = 4;
}
// CreateForgeRequest registers a provider and explicit API URL.
message CreateForgeRequest {
  // kind selects a registered forge provider.
  string kind = 1;
  // base_url is an HTTP(S) API URL without user info, query or fragment.
  string base_url = 2;
  // name is an owner-defined label.
  string name = 3;
}
// ForgeRequest identifies a forge.
message ForgeRequest {
  // id is the forge ID.
  string id = 1;
}
// ListForgesResponse contains registered endpoints in ID order.
message ListForgesResponse {
  // forges contains metadata only.
  repeated Forge forges = 1;
}
// CreateConnectionRequest submits a credential for validation and encryption.
message CreateConnectionRequest {
  // forge_id selects a registered endpoint.
  string forge_id = 1;
  // name is an owner-defined label.
  string name = 2;
  // credential is secret input and is never included in metadata or errors.
  string credential = 3;
}
// ConnectionRequest identifies a connection.
message ConnectionRequest {
  // id is the connection ID.
  string id = 1;
}
// ListConnectionsResponse contains connection metadata in ID order.
message ListConnectionsResponse {
  // connections never contains credentials.
  repeated Connection connections = 1;
}
// RotateCredentialRequest replaces a connection's credential after validation.
message RotateCredentialRequest {
  // id is the connection ID.
  string id = 1;
  // credential is the replacement secret.
  string credential = 2;
}
// CreateClientRequest grants access to an explicit set of connections.
message CreateClientRequest {
  // name is an owner-defined label.
  string name = 1;
  // connection_ids lists existing connections; empty grants no access.
  repeated string connection_ids = 2;
  // can_issue_tokens permits disclosure of forge tokens through IssueToken.
  bool can_issue_tokens = 3;
}
// CreateClientResponse is the only opportunity to obtain the new client token.
message CreateClientResponse {
  // client contains the new client's grants.
  Client client = 1;
  // token is a secret; save it securely and never log this response.
  string token = 2;
}
// ClientRequest identifies a client.
message ClientRequest {
  // id is the client ID.
  string id = 1;
}
// ListClientsResponse contains grants in ID order, without tokens or hashes.
message ListClientsResponse {
  // clients contains metadata only.
  repeated Client clients = 1;
}
// IssueTokenRequest selects a connection authorized by the bearer client token.
message IssueTokenRequest {
  // connection_id is the requested connection.
  string connection_id = 1;
}
// IssueTokenResponse deliberately discloses a secret to an authorized client.
message IssueTokenResponse {
  // kind selects the forge's authentication format.
  string kind = 1;
  // base_url is the forge API endpoint for token.
  string base_url = 2;
  // token is the decrypted credential; never log this response.
  string token = 3;
}
// VerifyClientRequest selects a connection to check against the bearer token.
message VerifyClientRequest {
  // connection_id is the requested connection.
  string connection_id = 1;
}
