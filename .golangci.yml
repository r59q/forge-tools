# Shared golangci-lint config for all Go projects.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - dupl
    - errorlint
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocritic
    - gosec
    - interfacebloat
    - ireturn
    - lll
    - misspell
    - nestif
    - noctx
    - revive
  settings:
    depguard:
      rules:
        library-no-transport:
          files:
            - "**/forge-*/library/**"
            - "!**/forge-connector/**"
          deny:
            - pkg: "github.com/r59q/forge-tools/forge-explorer/service"
              desc: libraries must not import services
            - pkg: "google.golang.org/grpc"
              desc: libraries hold business rules; transport belongs in services
            - pkg: "github.com/grpc-ecosystem"
              desc: libraries hold business rules; transport belongs in services
            - pkg: "google.golang.org/protobuf"
              desc: libraries hold business rules; transport belongs in services
            - pkg: "github.com/r59q/forge-tools/forge-actions/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-changes/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-checkouts/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-code/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-issues/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-pipeprint/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-repositories/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-review/service"
              desc: libraries must not import services
            - pkg: "github.com/r59q/forge-tools/forge-tools-management/service"
              desc: libraries must not import services
        core-no-tools:
          files:
            - "**/forge-core/**"
          deny:
            - pkg: "github.com/r59q/forge-tools/forge-explorer"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-actions"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-changes"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-checkouts"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-code"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-issues"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-pipeprint"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-repositories"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-review"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-tools-management"
              desc: forge-core must not depend on any tool
            - pkg: "github.com/r59q/forge-tools/forge-connector"
              desc: forge-core must not depend on any tool
        connector-no-tools:
          files:
            - "**/forge-connector/**"
          deny:
            - pkg: "github.com/r59q/forge-tools/forge-explorer"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-actions"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-changes"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-checkouts"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-code"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-issues"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-pipeprint"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-repositories"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-review"
              desc: forge-connector knows no tool domain
            - pkg: "github.com/r59q/forge-tools/forge-tools-management"
              desc: forge-connector knows no tool domain
        actions-no-other-tools:
          files:
            - "**/forge-actions/**"
          deny:
            - pkg: "github.com/r59q/forge-tools/forge-explorer"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-changes"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-checkouts"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-code"
              desc: tools must not depend on each other
