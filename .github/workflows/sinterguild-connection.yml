name: sinterguild-connection

on:
  push:
    branches: [master]
    paths:
      - sinterguild/connection/**
      - eslint.rules.mjs
      - .github/workflows/sinterguild-connection.yml
  pull_request:
    paths:
      - sinterguild/connection/**
      - eslint.rules.mjs
      - .github/workflows/sinterguild-connection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sinterguild/connection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sinterguild/connection/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
