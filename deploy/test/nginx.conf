# Serves each service's REST API at /<service>/, such as
# /reactor/v1/subscriptions. The broker, the proxy and RabbitMQ stay internal.

# Docker's DNS, so recreated services are found at their new address.
resolver 127.0.0.11 valid=10s ipv6=off;

# The request path without its /<service> prefix, undecoded, with the query.
map $request_uri $service_uri {
    "~^/[a-z]+(?<rest>/.*)$" $rest;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;

    # forge-code accepts commits up to 96 MiB and streams for 10 minutes.
    client_max_body_size 100m;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(?<service>management|repositories|issues|actions|checkouts|code|changes|review|pipeprint|reactor)/ {
        proxy_pass http://$service:8080$service_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        return 404;
    }
}
