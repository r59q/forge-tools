name: integration

# Runs the full-stack example against r59q/test-repo on GitHub and GitLab, and
# gitmyagent/test-repo on a self-hosted Forgejo. It needs secrets, so it never
# runs on pull requests.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        id: start
        run: scripts/fullstack.sh start
      - name: Test GitHub
        env:
          FORGE_TEST_FORGE: github
          FORGE_TEST_TOKEN: ${{ secrets.GH_TEST_REPO_PAT }}
        run: scripts/integration-test.sh
      # Run each forge test even if another failed, so all results show.
      - name: Test GitLab
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          FORGE_TEST_FORGE: gitlab
          FORGE_TEST_REPOSITORY: r59q/test-repo
          FORGE_TEST_TOKEN: ${{ secrets.GL_TEST_REPO_PAT }}
        run: scripts/integration-test.sh
      - name: Test Forgejo
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          FORGE_TEST_FORGE: forgejo
          FORGE_TEST_HOST: ${{ secrets.FJ_TEST_REPO_DOMAIN }}
          FORGE_TEST_REPOSITORY: gitmyagent/test-repo
          FORGE_TEST_TOKEN: ${{ secrets.FJ_TEST_REPO_PAT }}
        run: scripts/integration-test.sh
      - name: Show logs
        if: failure()
        run: docker compose -f examples/fullstack/compose.yaml logs
      - name: Clean up
        if: always()
        run: scripts/fullstack.sh clear
