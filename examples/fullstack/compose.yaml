# The full stack, including persistent repository working copies.
# Build from the repository root through each project's Dockerfile.
# Management and checkouts bind to host loopback; see README.md.
services:
  # Stores forge connections and their encrypted tokens.
  broker:
    build:
      context: ../..
      dockerfile: forge-connector/broker/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_BROKER_KEY: ${FORGE_BROKER_KEY:?set in .env}
      FORGE_BROKER_ADMIN_TOKEN: ${FORGE_BROKER_ADMIN_TOKEN:?set in .env}
    volumes:
      - broker-data:/data

  # Calls forges for the other services, with tokens from the broker.
  # Management registers its token in the broker at startup.
  proxy:
    build:
      context: ../..
      dockerfile: forge-connector/proxy/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_PROXY_BROKER_ADDR: broker:9090
      FORGE_PROXY_DOWNLOAD_HOSTS: "${FORGE_PROXY_DOWNLOAD_HOSTS-*.blob.core.windows.net,*.actions.githubusercontent.com}"
      FORGE_PROXY_TOKEN: ${FORGE_PROXY_TOKEN:?set in .env}

  # Lists repositories of every connection, through the proxy. It never
  # holds forge tokens.
  repositories:
    build:
      context: ../..
      dockerfile: forge-repositories/service/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_REPOSITORIES_TOKEN: ${FORGE_REPOSITORIES_TOKEN:?set in .env}
      FORGE_REPOSITORIES_CONNECTOR_URL: http://proxy:8081
      FORGE_REPOSITORIES_CONNECTOR_TOKEN: ${FORGE_REPOSITORIES_CONNECTOR_TOKEN:?set in .env}

  # Lists issues of every connection, through the proxy. It never holds
  # forge tokens.
  issues:
    build:
      context: ../..
      dockerfile: forge-issues/service/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_ISSUES_TOKEN: ${FORGE_ISSUES_TOKEN:?set in .env}
      FORGE_ISSUES_CONNECTOR_URL: http://proxy:8081
      FORGE_ISSUES_CONNECTOR_TOKEN: ${FORGE_ISSUES_CONNECTOR_TOKEN:?set in .env}

  actions:
    build:
      context: ../..
      dockerfile: forge-actions/service/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_ACTIONS_TOKEN: ${FORGE_ACTIONS_TOKEN:?set in .env}
      FORGE_ACTIONS_CONNECTOR_URL: http://proxy:8081
      FORGE_ACTIONS_CONNECTOR_TOKEN: ${FORGE_ACTIONS_CONNECTOR_TOKEN:?set in .env}
    ports:
      - "127.0.0.1:8089:8080"
      - "127.0.0.1:9099:9090"

  checkouts:
    build:
      context: ../..
      dockerfile: forge-checkouts/service/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_CHECKOUTS_TOKEN: ${FORGE_CHECKOUTS_TOKEN:?set in .env}
      FORGE_CHECKOUTS_CONNECTOR_URL: http://proxy:8081
      FORGE_CHECKOUTS_CONNECTOR_TOKEN: ${FORGE_CHECKOUTS_CONNECTOR_TOKEN:?set in .env}
    volumes:
      - checkouts-data:/data
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:9098:9090"

  management:
    build:
      context: ../..
      dockerfile: forge-tools-management/service/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_MANAGEMENT_TOKEN: ${FORGE_MANAGEMENT_TOKEN:?set in .env}
      FORGE_MANAGEMENT_CONNECTOR_ADDRESS: broker:9090
      FORGE_MANAGEMENT_CONNECTOR_INSECURE: "true"
      FORGE_MANAGEMENT_CONNECTOR_ADMIN_TOKEN: ${FORGE_BROKER_ADMIN_TOKEN:?set in .env}
      # Registered in the broker at startup, for the proxy, repositories and
      # issues, checkouts and actions.
      FORGE_MANAGEMENT_PROXY_TOKEN: ${FORGE_PROXY_TOKEN:?set in .env}
      FORGE_MANAGEMENT_REPOSITORIES_CONNECTOR_TOKEN: ${FORGE_REPOSITORIES_CONNECTOR_TOKEN:?set in .env}
      FORGE_MANAGEMENT_REPOSITORIES_ADDRESS: repositories:9090
      FORGE_MANAGEMENT_REPOSITORIES_INSECURE: "true"
      FORGE_MANAGEMENT_REPOSITORIES_TOKEN: ${FORGE_REPOSITORIES_TOKEN:?set in .env}
      FORGE_MANAGEMENT_ACTIONS_CONNECTOR_TOKEN: ${FORGE_ACTIONS_CONNECTOR_TOKEN:?set in .env}
      FORGE_MANAGEMENT_ACTIONS_ADDRESS: actions:9090
      FORGE_MANAGEMENT_ACTIONS_INSECURE: "true"
      FORGE_MANAGEMENT_ACTIONS_TOKEN: ${FORGE_ACTIONS_TOKEN:?set in .env}
      FORGE_MANAGEMENT_CHECKOUTS_CONNECTOR_TOKEN: ${FORGE_CHECKOUTS_CONNECTOR_TOKEN:?set in .env}
      FORGE_MANAGEMENT_ISSUES_CONNECTOR_TOKEN: ${FORGE_ISSUES_CONNECTOR_TOKEN:?set in .env}
      FORGE_MANAGEMENT_ISSUES_ADDRESS: issues:9090
      FORGE_MANAGEMENT_ISSUES_INSECURE: "true"
      FORGE_MANAGEMENT_ISSUES_TOKEN: ${FORGE_ISSUES_TOKEN:?set in .env}
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:9093:9090"

volumes:
  broker-data:
  checkouts-data:
    name: ${FORGE_CHECKOUTS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_checkouts-data}
