              desc: tools must not depend on each other
    dupl:
      threshold: 150
    funlen:
      lines: 80
      statements: 50
    goconst:
      min-len: 5
      min-occurrences: 4
    gocognit:
      min-complexity: 30
    lll:
      line-length: 140
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: exported
        - name: file-length-limit
          arguments:
            - max: 400
              skipComments: true
              skipBlankLines: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - contextcheck
          - dupl
          - funlen
          - gochecknoglobals
          - gocognit
          - goconst
          - gosec
          - ireturn
          - lll
          - nestif
          - noctx
      - path: _test\.go
        linters:
          - revive
        text: file-length-limit

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
