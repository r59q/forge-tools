<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge Explorer</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <h1>Forge Explorer</h1>
      <p>Browse and search a configured worktree.</p>
    </header>
    <form id="connect">
      <label
        >Service token
        <input id="token" type="password" autocomplete="off" required
      /></label>
      <button type="submit">Connect</button>
      <label
        >Source
        <select id="source" aria-label="Source"></select
      ></label>
    </form>
    <p id="connection-status" role="status">
      Enter the service token to connect.
    </p>
    <div id="explorer"></div>
    <footer>
      Interface components adapted from
      <a href="https://nudaui.dev">NudaUI</a> ·
      <a href="/NUDAUI-LICENSE.txt">MIT license</a>
    </footer>
  </body>
</html>
