name: Protobuf

# Lints, format-checks and breaking-checks one project's protobuf files with
# the root buf.yaml, and checks that its generated code is up to date. Called
# by the tool workflows.
on:
  workflow_call:
    inputs:
      dir:
        description: Project folder with proto/ and buf.gen.yaml, e.g. forge-issues/service.
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.74.0
          setup_only: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: ${{ inputs.dir }}/go.mod
      - name: Lint
        env:
          DIR: ${{ inputs.dir }}
        run: buf lint "$DIR/proto"
      - name: Check formatting
        env:
          DIR: ${{ inputs.dir }}
        run: buf format --diff --exit-code "$DIR/proto"
      - name: Check breaking changes
        if: github.event_name == 'pull_request'
        env:
          DIR: ${{ inputs.dir }}
          BASE_REF: ${{ github.base_ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e FETCH_HEAD:buf.yaml; then
            echo "Base branch has no buf.yaml yet, skipping."
            exit 0
          fi
          buf breaking "$DIR/proto" --against "$REPO_URL#branch=$BASE_REF,subdir=$DIR/proto"
      - name: Check generated code
        working-directory: ${{ inputs.dir }}
        run: |
          buf generate
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .
            echo "Generated code is out of date. Run buf generate in this folder."
            exit 1
          fi
