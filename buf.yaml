# Shared buf workspace with every protobuf module. Each project has its own
# buf.gen.yaml to regenerate its code.
version: v2

modules:
  - path: forge-actions/service/proto
  - path: forge-changes/service/proto
  - path: forge-checkouts/service/proto
  - path: forge-code/service/proto
  - path: forge-connector/library/proto
  - path: forge-issues/service/proto
  - path: forge-repositories/service/proto
  - path: forge-review/service/proto
  - path: forge-tools-management/service/proto

deps:
  - buf.build/googleapis/googleapis

lint:
  use:
    - STANDARD

breaking:
  use:
    - FILE
