name: forge-changes-library

# Libraries are published as Go modules through git, so there is no deploy job.
on:
  push:
    branches: [master]
    paths:
      - forge-changes/library/**
      - forge-core/forgeapi/**
      - .github/workflows/forge-changes-library.yml
      - .github/workflows/reusable-go.yml
  pull_request:
    paths:
      - forge-changes/library/**
      - forge-core/forgeapi/**
      - .github/workflows/forge-changes-library.yml
      - .github/workflows/reusable-go.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-go.yml
    with:
      dir: forge-changes/library
