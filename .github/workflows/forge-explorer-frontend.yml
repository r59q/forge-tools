name: forge-explorer-frontend

on:
  push:
    branches: [master]
    paths:
      - forge-explorer/frontend/**
      - .github/workflows/forge-explorer-frontend.yml
      - .github/workflows/reusable-explorer-frontend.yml
  pull_request:
    paths:
      - forge-explorer/frontend/**
      - .github/workflows/forge-explorer-frontend.yml
      - .github/workflows/reusable-explorer-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-explorer-frontend.yml

  publish:
    if: github.repository == 'r59q/forge-tools' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: explorer-npm-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: forge-explorer/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: forge-explorer/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@r59q'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish unpublished version to GitHub Packages
        run: node tools/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
