              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-actions"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-changes"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-checkouts"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-issues"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-repositories"
