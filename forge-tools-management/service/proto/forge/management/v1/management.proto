syntax = "proto3";

package forge.management.v1;

import "forge/actions/v1/actions.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/r59q/forge-tools/forge-tools-management/service/managementpb";

// ManagementService sets up and inspects forge-tools. Every RPC requires the
// management operator token in Authorization: Bearer metadata. Use TLS across
// networks. Connection RPCs fail with UNIMPLEMENTED when no connector is
// configured, and webhook RPCs when no forge-reactor is.
service ManagementService {
  // ListPipelines reads one page. GET /v1/pipelines?source=&repository=.
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse) {
    option (google.api.http) = {get: "/v1/pipelines"};
  }
  // GetPipeline reads an execution. GET /v1/pipelines/{id}?source=&repository=.
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse) {
    option (google.api.http) = {
      get: "/v1/pipelines/{id}"
      response_body: "pipeline"
    };
  }
  // ListJobs reads latest jobs. GET /v1/pipelines/{id}/jobs?source=&repository=.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (google.api.http) = {get: "/v1/pipelines/{id}/jobs"};
  }
  // GetJob reads job and step details. GET /v1/jobs/{id}?source=&repository=.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{id}"
      response_body: "job"
    };
  }
  // ReadJobLog reads a bounded log snapshot. GET /v1/jobs/{id}/log?source=&repository=.
  rpc ReadJobLog(ReadJobLogRequest) returns (ReadJobLogResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{id}/log"
      response_body: "log"
    };
  }

  // ListRepositories returns a complete listing or an error, never partial
  // results. GET /v1/repositories. Backend authentication failures are
  // UNAVAILABLE, distinct from caller UNAUTHENTICATED errors.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option (google.api.http) = {get: "/v1/repositories"};
  }
  // ListIssues returns a complete issue listing or an error, never partial
  // results. GET /v1/issues?scope=&state=&source=&repository=. Without a
  // repository it lists the issues assigned to, or created by, each
  // connected account. Backend authentication failures are UNAVAILABLE.
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse) {
    option (google.api.http) = {get: "/v1/issues"};
  }
  // ListConnections lists forge connections, without credentials.
  // GET /v1/connections.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option (google.api.http) = {get: "/v1/connections"};
  }
  // AddConnection checks a forge credential with the forge, then stores it in
  // the connector. INVALID_ARGUMENT means bad input or a rejected credential.
  // POST /v1/connections.
  rpc AddConnection(AddConnectionRequest) returns (AddConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/connections"
      body: "*"
      response_body: "connection"
    };
  }
  // TestConnection rechecks a stored credential. FAILED_PRECONDITION means the
  // forge rejected it or could not be reached; ListConnections shows the new
  // status.
  // POST /v1/connections/{id}/test.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/connections/{id}/test"
      body: "*"
      response_body: "connection"
    };
  }
  // RotateCredential replaces a credential once the forge accepts it.
  // POST /v1/connections/{id}/credential.
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse) {
    option (google.api.http) = {
      post: "/v1/connections/{id}/credential"
      body: "*"
      response_body: "connection"
    };
  }
  // RemoveConnection deletes a connection and its credential.
  // DELETE /v1/connections/{id}.
  rpc RemoveConnection(RemoveConnectionRequest) returns (RemoveConnectionResponse) {
    option (google.api.http) = {delete: "/v1/connections/{id}"};
  }
  // ListWebhooks lists forge-reactor webhook sources, without secrets.
  // GET /v1/webhooks.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (google.api.http) = {get: "/v1/webhooks"};
  }
  // AddWebhook creates a webhook source with a new secret and, with
  // register, the webhook on every repository. POST /v1/webhooks.
  rpc AddWebhook(AddWebhookRequest) returns (AddWebhookResponse) {
    option (google.api.http) = {
      post: "/v1/webhooks"
      body: "*"
    };
  }
  // RotateWebhookSecret gives a managed source a new secret.
  // POST /v1/webhooks/{id}:rotate.
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse) {
    option (google.api.http) = {
      post: "/v1/webhooks/{id}:rotate"
      body: "*"
    };
  }
  // RemoveWebhook deletes a managed source and its registered webhooks.
  // DELETE /v1/webhooks/{id}.
  rpc RemoveWebhook(RemoveWebhookRequest) returns (RemoveWebhookResponse) {
    option (google.api.http) = {delete: "/v1/webhooks/{id}"};
  }
}

// ListRepositoriesRequest lists the repositories of every connection.
message ListRepositoriesRequest {}

// ListRepositoriesResponse distinguishes absent capabilities from empty lists.
message ListRepositoriesResponse {
  // configured is false when management has no repository capability.
  bool configured = 1;
  // repositories is complete only when the RPC succeeds.
  repeated Repository repositories = 2;
}

// Repository contains display metadata, without URLs or credentials.
message Repository {
  // source_id and path together identify this repository.
  string source_id = 1;
  // forge is the kind, such as github, gitlab or forgejo.
  string forge = 2;
  // host is the originating forge's web host.
  string host = 3;
  // path is the full repository path, including any nested groups.
  string path = 4;
  string description = 5;
  // visibility is public, internal or private, as reported upstream.
  string visibility = 6;
}

// ListIssuesRequest selects issues. Empty fields list the open issues
// assigned to each connected account.
message ListIssuesRequest {
  // scope is assigned or created. It must be empty with a repository.
  string scope = 1;
  // state is open, closed or all.
  string state = 2;
  // source limits the listing to one connection ID.
  string source = 3;
  // repository lists one repository's issues, such as owner/name.
  string repository = 4;
}

// ListIssuesResponse distinguishes absent capabilities from empty lists.
message ListIssuesResponse {
  // configured is false when management has no issue capability.
  bool configured = 1;
  // issues is complete only when the RPC succeeds.
  repeated Issue issues = 2;
}

// Issue contains display metadata, without bodies, URLs or credentials.
message Issue {
  // source_id, repository and number together identify this issue.
  string source_id = 1;
  // forge is the kind, such as github, gitlab or forgejo.
  string forge = 2;
  // host is the originating forge's web host.
  string host = 3;
  // repository is the full repository path.
  string repository = 4;
  // number is the issue number shown on the forge.
  int64 number = 5;
  string title = 6;
  // state is open or closed.
  string state = 7;
  // author is the author's login.
  string author = 8;
  // assignees are logins.
  repeated string assignees = 9;
  // labels are label names.
  repeated string labels = 10;
  // comments is the comment count.
  int32 comments = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// ListConnectionsRequest lists every forge connection.
message ListConnectionsRequest {}

// ListConnectionsResponse distinguishes an absent connector from no connections.
message ListConnectionsResponse {
  // configured is false when management has no connector.
  bool configured = 1;
  repeated Connection connections = 2;
}

// Connection is forge connection metadata. Credentials are write-only.
message Connection {
  string id = 1;
  // name is an operator-defined label.
  string name = 2;
  // forge is the kind, such as github, gitlab or forgejo.
  string forge = 3;
  // base_url is the forge API endpoint.
  string base_url = 4;
  // login is the forge user of the last successful check.
  string login = 5;
  // status is ok, invalid or revoked. Only ok connections are used.
  string status = 6;
  // checked_at is the last credential check.
  google.protobuf.Timestamp checked_at = 7;
}

// AddConnectionRequest describes a new connection.
message AddConnectionRequest {
  // forge is github, gitlab or forgejo.
  string forge = 1;
  // host is the forge's web address, such as gitlab.example.com. It defaults
  // to github.com, gitlab.com or codeberg.org.
  string host = 2;
  // name is an operator-defined label.
  string name = 3;
  // credential is a forge access token. It is never returned.
  string credential = 4;
}

// AddConnectionResponse contains the new connection; REST returns it bare.
message AddConnectionResponse {
  Connection connection = 1;
}

// TestConnectionRequest identifies the connection to recheck.
message TestConnectionRequest {
  string id = 1;
}

// TestConnectionResponse contains the checked connection; REST returns it bare.
message TestConnectionResponse {
  Connection connection = 1;
}

// RotateCredentialRequest replaces a connection's credential.
message RotateCredentialRequest {
  string id = 1;
  // credential is the new forge access token. It is never returned.
  string credential = 2;
}

// RotateCredentialResponse contains the updated connection; REST returns it
// bare.
message RotateCredentialResponse {
  Connection connection = 1;
}

// RemoveConnectionRequest identifies the connection to delete.
message RemoveConnectionRequest {
  string id = 1;
}

// RemoveConnectionResponse is empty.
message RemoveConnectionResponse {}

// ListPipelinesRequest selects one source and repository. Page defaults to 1.
// Branch is a branch name; definition_id is a GitHub ID or Forgejo filename.
message ListPipelinesRequest {
  string source = 1;
  string repository = 2;
  int32 page = 3;
  string commit = 4;
  string branch = 5;
  string definition_id = 6;
  string phase = 7;
  string result = 8;
}

// ListPipelinesResponse distinguishes an absent capability from an empty page.
message ListPipelinesResponse {
  bool configured = 1;
  repeated forge.actions.v1.Pipeline pipelines = 2;
  int32 next_page = 3;
}

// GetPipelineRequest identifies a pipeline by its native ID.
message GetPipelineRequest {
  string source = 1;
  string repository = 2;
  string id = 3;
}

// GetPipelineResponse contains the pipeline; REST returns it bare.
message GetPipelineResponse {
  forge.actions.v1.Pipeline pipeline = 1;
}

// ListJobsRequest identifies the pipeline whose jobs to list.
message ListJobsRequest {
  string source = 1;
  string repository = 2;
  string id = 3;
}

// ListJobsResponse contains a pipeline's latest jobs.
message ListJobsResponse {
  repeated forge.actions.v1.Job jobs = 1;
}

// GetJobRequest identifies a job by its native ID.
message GetJobRequest {
  string source = 1;
  string repository = 2;
  string id = 3;
}

// GetJobResponse contains the job; REST returns it bare.
message GetJobResponse {
  forge.actions.v1.Job job = 1;
}

// ReadJobLogRequest identifies a job by its native ID.
message ReadJobLogRequest {
  string source = 1;
  string repository = 2;
  string id = 3;
}

// ReadJobLogResponse contains the log; REST returns it bare.
message ReadJobLogResponse {
  forge.actions.v1.Log log = 1;
}

// Webhook is a forge-reactor webhook source, without its secret.
message Webhook {
  // id names the source; forges deliver to /webhooks/{id}.
  string id = 1;
  // forge is github or forgejo.
  string forge = 2;
  // connection is the forge-connector connection its events carry.
  string connection = 3;
  // repositories, if set, are the only owner/name paths accepted.
  repeated string repositories = 4;
  // managed is false for sources from forge-reactor's configuration file.
  bool managed = 5;
  // registered reports webhooks forge-reactor created on the forge.
  bool registered = 6;
  // url is the payload URL, if forge-reactor has a public URL.
  string url = 7;
  // created_at is when a managed source was created.
  google.protobuf.Timestamp created_at = 8;
}

// ListWebhooksRequest lists every webhook source.
message ListWebhooksRequest {}

// ListWebhooksResponse distinguishes an absent capability from an empty list.
message ListWebhooksResponse {
  // configured is false when management has no forge-reactor.
  bool configured = 1;
  // webhooks are configured sources, then managed ones.
  repeated Webhook webhooks = 2;
}

// AddWebhookRequest describes a webhook source.
message AddWebhookRequest {
  // id names the source.
  string id = 1;
  // connection is a forge-connector connection ID. It supplies the forge.
  string connection = 2;
  // repositories are owner/name paths.
  repeated string repositories = 3;
  // register creates the webhook on every repository.
  bool register = 4;
  // forge is github or forgejo; needed only without a connection.
  string forge = 5;
}

// AddWebhookResponse returns the source and its secret, shown once.
message AddWebhookResponse {
  Webhook webhook = 1;
  string secret = 2;
}

// RotateWebhookSecretRequest names a managed source.
message RotateWebhookSecretRequest {
  string id = 1;
}

// RotateWebhookSecretResponse returns the new secret, shown once.
message RotateWebhookSecretResponse {
  Webhook webhook = 1;
  string secret = 2;
  // failed_repositories still have the old secret on the forge.
  repeated string failed_repositories = 3;
}

// RemoveWebhookRequest names a managed source.
message RemoveWebhookRequest {
  string id = 1;
}

// RemoveWebhookResponse lists webhooks left on the forge.
message RemoveWebhookResponse {
  // failed_repositories still have the webhook; remove it by hand.
  repeated string failed_repositories = 1;
}
