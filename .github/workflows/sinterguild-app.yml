name: sinterguild-app

on:
  push:
    branches: [master]
    paths:
      - sinterguild/app/**
      - sinterguild/connection/package.json
      - sinterguild/connection/src/**
      - forge-chat/frontend/package.json
      - forge-chat/frontend/src/**
      - eslint.rules.mjs
      - .dockerignore
      - .github/workflows/sinterguild-app.yml
      - .github/workflows/reusable-docker.yml
  pull_request:
    paths:
      - sinterguild/app/**
      - sinterguild/connection/package.json
      - sinterguild/connection/src/**
      - forge-chat/frontend/package.json
      - forge-chat/frontend/src/**
      - eslint.rules.mjs
      - .dockerignore
      - .github/workflows/sinterguild-app.yml
      - .github/workflows/reusable-docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sinterguild/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sinterguild/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  image:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: sinterguild-app
      dockerfile: sinterguild/app/Dockerfile

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: sinterguild-app
      dockerfile: sinterguild/app/Dockerfile
      push: true
