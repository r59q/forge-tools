name: forge-connector-proxy

on:
  push:
    branches: [master]
    paths:
      - forge-connector/proxy/**
      - forge-connector/library/**
      - forge-core/forgeapi/**
      - .dockerignore
      - .github/workflows/forge-connector-proxy.yml
      - .github/workflows/reusable-*.yml
  pull_request:
    paths:
      - forge-connector/proxy/**
      - forge-connector/library/**
      - forge-core/forgeapi/**
      - .dockerignore
      - .github/workflows/forge-connector-proxy.yml
      - .github/workflows/reusable-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-go.yml
    with:
      dir: forge-connector/proxy

  # Pull requests build the image without pushing or registry access.
  image:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: forge-connector-proxy
      dockerfile: forge-connector/proxy/Dockerfile

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image: forge-connector-proxy
      dockerfile: forge-connector/proxy/Dockerfile
      push: true
