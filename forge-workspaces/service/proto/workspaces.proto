syntax = "proto3";
package forge.workspaces.v1;
option go_package = "github.com/r59q/forge-tools/forge-workspaces/service/workspacespb";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// WorkspacesService manages host-local working copies. All RPCs require a bearer
// service token. Consumers must stop writing before removal; this is no sandbox.
service WorkspacesService {
  // CreateWorkspace prepares an independent checkout at a resolved commit.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace) { option (google.api.http) = {post:"/v1/workspaces" body:"*"}; }
  // ListWorkspaces includes ready, retained and failed workspaces.
  rpc ListWorkspaces(google.protobuf.Empty) returns (ListWorkspacesResponse) { option (google.api.http) = {get:"/v1/workspaces"}; }
  // GetWorkspace reads durable creation metadata, even if files are missing.
  rpc GetWorkspace(WorkspaceRequest) returns (Workspace) { option (google.api.http) = {get:"/v1/workspaces/{id}"}; }
  // RetainWorkspace records that a workspace should be kept until explicit removal.
  rpc RetainWorkspace(WorkspaceRequest) returns (Workspace) { option (google.api.http) = {post:"/v1/workspaces/{id}/retain" body:"*"}; }
  // RemoveWorkspace refuses uncommitted files unless discard is explicitly true.
  rpc RemoveWorkspace(RemoveWorkspaceRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete:"/v1/workspaces/{id}"}; }
  // InspectWorkspace reads current HEAD, attached branch and changed paths.
  rpc InspectWorkspace(WorkspaceRequest) returns (Status) { option (google.api.http) = {get:"/v1/workspaces/{id}/status"}; }
  // ReadDiff returns separate staged and unstaged binary patches.
  rpc ReadDiff(WorkspaceRequest) returns (Diff) { option (google.api.http) = {get:"/v1/workspaces/{id}/diff"}; }
}
// Repository selects local_path alone, or connector source and repository path.
// Local paths are meaningful only on the service host and must be trusted.
message Repository { string local_path=1; string source=2; string path=3; }
// CreateWorkspaceRequest accepts a branch, tag or commit. Empty reference means HEAD.
message CreateWorkspaceRequest { Repository repository=1; string reference=2; }
// Workspace records the initial resolved revision; Status reports current HEAD.
// State is creating, ready, retained, removing or failed. Location is host-local.
message Workspace { string id=1; Repository repository=2; string reference=3; string revision=4; string state=5; google.protobuf.Timestamp created_at=6; string location=7; }
// WorkspaceRequest selects a stable workspace ID.
message WorkspaceRequest { string id=1; }
// RemoveWorkspaceRequest opts into discarding files only when discard is true.
message RemoveWorkspaceRequest { string id=1; bool discard=2; }
// ListWorkspacesResponse orders durable metadata by creation time and ID.
message ListWorkspacesResponse { repeated Workspace workspaces=1; }
// File uses Git porcelain status codes for index and worktree, including ?? and !!.
// Old_path is set for renames/copies. Paths are relative to the workspace.
message File { string path=1; string old_path=2; string index=3; string worktree=4; }
// Status reports the current revision, optional branch and all changed paths.
// Initial checkouts are detached, so branch is initially empty.
message Status { string revision=1; string branch=2; repeated File files=3; }
// Diff carries binary-capable patches as bytes (base64 in JSON), each at most 8 MiB.
// Untracked and ignored file contents are excluded; Status lists their paths.
message Diff { bytes staged=1; bytes unstaged=2; }
