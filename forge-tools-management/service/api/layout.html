{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · Forge Tools Management</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span>Forge Tools <span class="badge">Management</span></span>
    <nav aria-label="Sections">
      <a href="/"{{if eq .Page "repositories"}} aria-current="page"{{end}}>Repositories</a>
      <a href="/issues"{{if eq .Page "issues"}} aria-current="page"{{end}}>Issues</a>
      <a href="/connections"{{if eq .Page "connections"}} aria-current="page"{{end}}>Connections</a>
    </nav>
  </header>
  <main>{{template "content" .}}</main>
</body>
</html>
{{end}}
