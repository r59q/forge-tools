            - pkg: "github.com/r59q/forge-tools/forge-pipeprint"
              desc: tools must not depend on each other
        issues-no-other-tools:
          files:
            - "**/forge-issues/**"
          deny:
            - pkg: "github.com/r59q/forge-tools/forge-explorer"
              desc: tools must not depend on each other
            - pkg: "github.com/r59q/forge-tools/forge-actions"
